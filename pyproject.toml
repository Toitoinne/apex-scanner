[project]
name = "apex-scanner"
version = "1.0.0"
description = "Détecteur de memecoins pump.fun auto-apprenant et auto-supervisé"
requires-python = ">=3.12"
dependencies = [
  "river>=0.21",
  "lightgbm>=4.3",
  "scikit-learn>=1.4",
  "scipy>=1.12",
  "numpy>=1.26",
  "pyyaml>=6",
  "tzdata>=2024.1",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "redis>=5",
  "asyncpg>=0.29",
  "websockets>=12",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "anthropic>=1.11",
  "base58>=2.1",
  "orjson>=3.9",
  "solders>=0.21",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apex*"]

[tool.setuptools.package-data]
apex = ["dashboard/static/*"]
